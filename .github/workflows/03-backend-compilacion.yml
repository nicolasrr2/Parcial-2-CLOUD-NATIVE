name: Backend - Compilación

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "microservices/notificaciones-service/**"
      - "microservices/documentos-service/**"
      - "microservices/rabbit-admin-service/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "microservices/notificaciones-service/**"
      - "microservices/documentos-service/**"
      - "microservices/rabbit-admin-service/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-backend:
    name: Verificar aplicaciones Java
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17 Temurin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verificar backend
        working-directory: backend
        run: mvn -B clean verify

      - name: Verificar servicio de notificaciones
        working-directory: microservices/notificaciones-service
        run: mvn -B clean verify

      - name: Verificar servicio de documentos
        working-directory: microservices/documentos-service
        run: mvn -B clean verify

      - name: Verificar servicio Rabbit Admin
        working-directory: microservices/rabbit-admin-service
        run: mvn -B clean verify

      - name: Verificar JAR generado
        working-directory: backend
        run: test -n "$(find target -maxdepth 1 -type f -name '*.jar' -print -quit)"

      - name: Subir JAR del backend
        uses: actions/upload-artifact@v4
        with:
          name: pedidos360-backend-jar
          path: backend/target/*.jar
          if-no-files-found: error
