name: Frontend - Despliegue

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pedidos360-frontend-production
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: Desplegar frontend Angular en Amplify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias Angular
        run: npm ci

      - name: Generar configuración runtime
        env:
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_REDIRECT_URI: ${{ vars.VITE_REDIRECT_URI }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          set -euo pipefail
          jq -n \
            --arg domain "$VITE_COGNITO_DOMAIN" \
            --arg client "$VITE_COGNITO_CLIENT_ID" \
            --arg redirect "$VITE_REDIRECT_URI" \
            --arg api "$VITE_API_URL" \
            '{
              COGNITO_DOMAIN: $domain,
              COGNITO_CLIENT_ID: $client,
              REDIRECT_URI: $redirect,
              API_URL: $api
            }' > public/config.json

      - name: Compilar frontend Angular productivo
        run: npm run build

      - name: Localizar salida de producción Angular
        run: |
          set -euo pipefail
          mapfile -t index_files < <(find dist -type f -name index.html -print)
          if (( ${#index_files[@]} != 1 )); then
            echo "Se esperaba exactamente un index.html de producción; encontrados: ${#index_files[@]}" >&2
            printf '%s\n' "${index_files[@]}" >&2
            exit 1
          fi
          output_dir="$(dirname "${index_files[0]}")"
          echo "ANGULAR_OUTPUT_DIR=frontend/$output_dir" >> "$GITHUB_ENV"
          echo "Salida Angular: $output_dir"

      - name: Crear ZIP para Amplify
        working-directory: .
        run: |
          set -euo pipefail
          output_dir="$GITHUB_WORKSPACE/$ANGULAR_OUTPUT_DIR"
          (cd "$output_dir" && zip -r "$GITHUB_WORKSPACE/frontend-amplify.zip" .)

      - name: Verificar paquete Amplify
        working-directory: .
        run: |
          set -euo pipefail
          unzip -Z1 frontend-amplify.zip
          unzip -Z1 frontend-amplify.zip | grep -Fxq "index.html"

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Crear deployment Amplify
        id: amplify-deployment
        working-directory: .
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ vars.AMPLIFY_BRANCH }}
        run: |
          set -euo pipefail
          RESPONSE=$(aws amplify create-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --output json)
          echo "job_id=$(jq -r '.jobId' <<< "$RESPONSE")" >> "$GITHUB_OUTPUT"
          echo "zip_upload_url=$(jq -r '.zipUploadUrl' <<< "$RESPONSE")" >> "$GITHUB_OUTPUT"

      - name: Subir ZIP a Amplify
        working-directory: .
        env:
          ZIP_UPLOAD_URL: ${{ steps.amplify-deployment.outputs.zip_upload_url }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --upload-file frontend-amplify.zip \
            --header "Content-Type: application/zip" \
            "$ZIP_UPLOAD_URL"

      - name: Iniciar deployment Amplify
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ vars.AMPLIFY_BRANCH }}
          JOB_ID: ${{ steps.amplify-deployment.outputs.job_id }}
        run: aws amplify start-deployment --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" --job-id "$JOB_ID"

      - name: Esperar resultado de Amplify
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ vars.AMPLIFY_BRANCH }}
          JOB_ID: ${{ steps.amplify-deployment.outputs.job_id }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            STATUS=$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" \
              --query 'job.summary.status' \
              --output text)
            echo "Estado Amplify: $STATUS"
            case "$STATUS" in
              SUCCEED) exit 0 ;;
              FAILED|CANCELLED) echo "Deployment Amplify terminó en $STATUS"; exit 1 ;;
              PENDING|RUNNING) sleep 5 ;;
              *) echo "Estado Amplify desconocido: $STATUS"; exit 1 ;;
            esac
          done
          echo "Tiempo de espera agotado para Amplify"
          exit 1

      - name: Probar URL pública
        env:
          FRONTEND_URL: ${{ vars.VITE_REDIRECT_URI }}
        run: curl --fail --silent --show-error --location --output /dev/null "$FRONTEND_URL"

      - name: Mostrar resumen del despliegue Angular
        env:
          JOB_ID: ${{ steps.amplify-deployment.outputs.job_id }}
          FRONTEND_URL: ${{ vars.VITE_REDIRECT_URI }}
        run: |
          echo "Frontend desplegado correctamente."
          echo "URL producción: $FRONTEND_URL"
          echo "Job Amplify: $JOB_ID"
          echo "Commit SHA: $GITHUB_SHA"
