name: Frontend - Compilación

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-frontend:
    name: Compilar frontend Angular
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias Angular
        run: npm ci

      - name: Ejecutar pruebas Angular
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Compilar frontend Angular
        run: npm run build

      - name: Localizar salida Angular
        run: |
          set -euo pipefail
          mapfile -t index_files < <(find dist -type f -name index.html -print)
          if (( ${#index_files[@]} != 1 )); then
            echo "Se esperaba exactamente un index.html de producción; encontrados: ${#index_files[@]}" >&2
            printf '%s\n' "${index_files[@]}" >&2
            exit 1
          fi
          output_dir="$(dirname "${index_files[0]}")"
          echo "ANGULAR_OUTPUT_DIR=frontend/$output_dir" >> "$GITHUB_ENV"
          echo "Salida Angular: $output_dir"

      - name: Subir salida de producción Angular
        uses: actions/upload-artifact@v4
        with:
          name: pedidos360-frontend-build
          path: ${{ env.ANGULAR_OUTPUT_DIR }}
          if-no-files-found: error
