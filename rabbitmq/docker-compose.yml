name: pedidos360-rabbitmq

x-rabbitmq-common: &rabbitmq-common
  image: rabbitmq:4-management
  restart: unless-stopped
  environment:
    RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
  networks:
    - rabbitmq_cluster
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s

services:

  rabbitmq-1:
    <<: *rabbitmq-common
    container_name: pedidos360-rabbitmq-1
    hostname: rabbitmq-1
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data_1:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

  rabbitmq-2:
    <<: *rabbitmq-common
    container_name: pedidos360-rabbitmq-2
    hostname: rabbitmq-2
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_data_2:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

  rabbitmq-3:
    <<: *rabbitmq-common
    container_name: pedidos360-rabbitmq-3
    hostname: rabbitmq-3
    ports:
      - "5674:5672"
      - "15674:15672"
    volumes:
      - rabbitmq_data_3:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

volumes:
  rabbitmq_data_1:
  rabbitmq_data_2:
  rabbitmq_data_3:

networks:
  rabbitmq_cluster:
    driver: bridge
